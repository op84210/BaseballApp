services:
  # PostgreSQL 資料庫
  - type: pserv
    name: baseball-db
    plan: free
    region: singapore

  # Web 應用
  - type: web
    name: baseball-app
    plan: free
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    
    # 環境變數
    envVars:
      - key: DatabaseType
        value: PostgreSQL
      - key: ConnectionStrings__PostgreSQL
        fromDatabase:
          name: baseball-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    
    # 自動部署
    autoDeploy: true
